name: Deploy Lovable para GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Compilar aplicação
        run: npm run build

      - name: Inspecionar build
        run: |
          echo "========================================"
          echo "CONTEÚDO DE .output"
          echo "========================================"
          find .output -maxdepth 5 -type f -print | sort || true

          echo ""
          echo "========================================"
          echo "CONTEÚDO DE .output/public"
          echo "========================================"
          find .output/public -maxdepth 5 -type f -print | sort || true

      - name: Preparar GitHub Pages
        run: |
          set -e

          echo "Preparando arquivos para GitHub Pages..."

          mkdir -p .output/public

          if [ -f ".output/public/_shell.html" ]; then
            echo "Encontrado _shell.html"
            cp ".output/public/_shell.html" ".output/public/index.html"
            cp ".output/public/_shell.html" ".output/public/404.html"

          elif [ -f ".output/public/index.html" ]; then
            echo "index.html já existe"
            cp ".output/public/index.html" ".output/public/404.html"

          else
            echo "ERRO: nenhum index.html ou _shell.html foi encontrado."

            echo ""
            echo "Arquivos encontrados:"
            find .output -maxdepth 5 -type f -print | sort || true

            exit 1
          fi

          echo ""
          echo "========================================"
          echo "ARQUIVOS FINAIS DO GITHUB PAGES"
          echo "========================================"

          find .output/public -maxdepth 5 -type f -print | sort

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
