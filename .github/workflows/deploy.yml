name: Deploy Lovable para GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Compilar aplicação
        run: npm run build

      - name: Preparar GitHub Pages
        run: |
          set -e

          echo "========================================"
          echo "PREPARANDO GITHUB PAGES"
          echo "========================================"

          # O TanStack Start está gerando o shell da SPA aqui:
          # dist/client/_shell.html

          if [ ! -f "dist/client/_shell.html" ]; then
            echo "ERRO: dist/client/_shell.html não foi encontrado."
            echo ""
            echo "Arquivos disponíveis:"
            find dist -maxdepth 5 -type f -print | sort
            exit 1
          fi

          echo "Encontrado:"
          echo "dist/client/_shell.html"

          # O GitHub Pages precisa de index.html.
          cp "dist/client/_shell.html" "dist/client/index.html"

          # 404.html permite que a SPA seja carregada
          # quando o GitHub Pages recebe uma rota diretamente.
          cp "dist/client/_shell.html" "dist/client/404.html"

          echo ""
          echo "========================================"
          echo "ARQUIVOS PUBLICADOS"
          echo "========================================"

          find dist/client -maxdepth 5 -type f -print | sort

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
