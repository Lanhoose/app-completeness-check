name: Deploy Lovable para GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Compilar aplicação
        run: npm run build

      - name: Localizar saída do build
        run: |
          echo "========================================"
          echo "ARQUIVOS GERADOS PELO BUILD"
          echo "========================================"

          find . \
            -type f \
            \( -name "index.html" -o -name "_shell.html" \) \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -print

          echo ""
          echo "========================================"
          echo "DIRETÓRIOS DE SAÍDA"
          echo "========================================"

          find . \
            -maxdepth 5 \
            -type d \
            \( -name "dist" -o -name ".output" -o -name "build" \) \
            -not -path "./node_modules/*" \
            -print

          echo ""
          echo "========================================"
          echo "ESTRUTURA DO PROJETO"
          echo "========================================"

          find . \
            -maxdepth 4 \
            -not -path "./node_modules*" \
            -not -path "./.git*" \
            -print | sort

      - name: Preparar arquivos para GitHub Pages
        run: |
          set -e

          echo "Procurando index.html..."

          INDEX=$(find . \
            -type f \
            -name "index.html" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERRO: nenhum index.html foi encontrado."
            echo ""
            echo "Arquivos HTML disponíveis:"
            find . \
              -type f \
              \( -name "*.html" -o -name "*.htm" \) \
              -not -path "./node_modules/*" \
              -not -path "./.git/*" \
              -print
            exit 1
          fi

          echo "index.html encontrado em:"
          echo "$INDEX"

          SOURCE_DIR=$(dirname "$INDEX")

          echo ""
          echo "Diretório de publicação:"
          echo "$SOURCE_DIR"

          mkdir -p "$GITHUB_WORKSPACE/pages"

          cp -R "$SOURCE_DIR"/. "$GITHUB_WORKSPACE/pages/"

          # GitHub Pages precisa de uma página de erro para
          # permitir o fallback da SPA.
          if [ -f "$GITHUB_WORKSPACE/pages/index.html" ]; then
            cp "$GITHUB_WORKSPACE/pages/index.html" \
               "$GITHUB_WORKSPACE/pages/404.html"
          fi

          echo ""
          echo "========================================"
          echo "ARQUIVOS FINAIS"
          echo "========================================"

          find "$GITHUB_WORKSPACE/pages" \
            -maxdepth 6 \
            -type f \
            -print | sort

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
