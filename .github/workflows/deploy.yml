name: Deploy Lovable para GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Compilar aplicação
        run: npm run build

      - name: Inspecionar saída do build
        run: |
          echo "========================================"
          echo "RAIZ DO PROJETO"
          echo "========================================"
          ls -la

          echo ""
          echo "========================================"
          echo "TODOS OS INDEX.HTML"
          echo "========================================"
          find . -type f -name "index.html" -print || true

          echo ""
          echo "========================================"
          echo "TODOS OS ARQUIVOS HTML"
          echo "========================================"
          find . -type f \( -name "*.html" -o -name "*.htm" \) -print | sort || true

          echo ""
          echo "========================================"
          echo "PASTAS DE SAÍDA"
          echo "========================================"
          find . -maxdepth 5 -type d \
            \( -name "dist" -o -name ".output" -o -name "build" -o -name "public" \) \
            -print | sort || true

          echo ""
          echo "========================================"
          echo "CONTEÚDO DE .output"
          echo "========================================"
          if [ -d ".output" ]; then
            find .output -maxdepth 6 -type f -print | sort
          else
            echo ".output não existe"
          fi

          echo ""
          echo "========================================"
          echo "CONTEÚDO DE dist"
          echo "========================================"
          if [ -d "dist" ]; then
            find dist -maxdepth 6 -type f -print | sort
          else
            echo "dist não existe"
          fi

          echo ""
          echo "========================================"
          echo "CONTEÚDO DE build"
          echo "========================================"
          if [ -d "build" ]; then
            find build -maxdepth 6 -type f -print | sort
          else
            echo "build não existe"
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
